name: Manual Bottle Build

run-name: Build bottle of ${{ inputs.formula }} on ${{ inputs.runner }}

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Build runner (e.g., macos-14, ubuntu-latest)
        required: true
      formula:
        description: Formula name
        required: true
      timeout:
        description: "Build timeout (in minutes)"
        type: number
        default: 60
        required: false

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_GITHUB_ACTIONS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_FROM_API: 1
  HOMEBREW_NO_BUILD_ERROR_ISSUES: 1

jobs:
  bottle:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@v1
        with:
          core: true
          cask: false

      - name: Build Bottle
        run: |
          brew test-bot \
            --only-formulae \
            --keep-old \
            --only-json-tab \
            --skip-online-checks \
            --skip-dependents \
            "${{ inputs.formula }}"

      - name: Post-build
        uses: Homebrew/actions/post-build@v1

      - name: Generate build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'bottles/'

      - name: Upload Bottles
        uses: actions/upload-artifact@v4
        with:
          name: bottles-${{ inputs.formula }}
          path: bottles/
